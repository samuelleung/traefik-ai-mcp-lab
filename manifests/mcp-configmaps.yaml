- apiVersion: v1
  data:
    server.py: |
      from fastapi import FastAPI
      from pydantic import BaseModel
      from pathlib import Path

      app = FastAPI(title="MCP-like Tool Server")

      DATA = Path("/data")
      DATA.mkdir(exist_ok=True)

      class WriteRequest(BaseModel):
          filename: str
          content: str

      @app.get("/")
      def root():
          return {"status": "ok"}

      @app.get("/tools")
      def tools():
          return {
              "tools": [
                  {"name": "list_files"},
                  {"name": "read_file"},
                  {"name": "write_file"},
                  {"name": "delete_file"}
              ]
          }

      @app.get("/files")
      def list_files():
          return {
              "files": [
                  p.name for p in DATA.iterdir() if p.is_file()
              ]
          }

      @app.get("/files/{filename}")
      def read_file(filename: str):
          path = DATA / filename

          if not path.exists():
              return {"error": "file not found"}

          return {
              "filename": filename,
              "content": path.read_text()
          }

      @app.post("/files")
      def write_file(req: WriteRequest):
          path = DATA / req.filename
          path.write_text(req.content)

          return {
              "status": "written",
              "filename": req.filename
          }

      @app.delete("/files/{filename}")
      def delete_file(filename: str):
          path = DATA / filename

          if not path.exists():
              return {"error": "file not found"}

          path.unlink()

          return {
              "status": "deleted",
              "filename": filename
          }
